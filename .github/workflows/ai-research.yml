name: KAPRI Night AI Council

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Тема ночного исследования"
        required: false
        default: "Найти лучшие улучшения К.А.П.Р.И. и план развития Mobile Runner"
permissions:
  contents: read
jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout KAPRI source
        uses: actions/checkout@v4
        with:
          repository: loslam-del/K.A.P.R.I
          path: source
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Gemini + OpenAI council
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          RESEARCH_FOCUS: ${{ inputs.focus }}
          SOURCE_REPOSITORY: loslam-del/K.A.P.R.I
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p reports
          python tools/ai_council.py --source source --output reports/overnight-council.md
      - name: Upload council report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kapri-ai-council
          path: reports/overnight-council.md
          if-no-files-found: warn
          retention-days: 30
      - name: Add report to job summary
        if: always() && hashFiles('reports/overnight-council.md') != ''
        run: cat reports/overnight-council.md >> "$GITHUB_STEP_SUMMARY"
